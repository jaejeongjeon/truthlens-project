<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthLens — 프로젝트 의견 게시판</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F5F2EC;
      --surface: #EDEAE3;
      --border: #D8D4CC;
      --text: #1A1916;
      --muted: #7A776F;
      --accent: #1A1916;
      --pill-active: #1A1916;
      --pill-text-active: #F5F2EC;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 24px 0 0;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-style: italic;
      color: var(--muted);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      margin-left: 8px;
    }

    .stats-bar {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .stats-bar strong {
      color: var(--text);
      font-weight: 600;
    }

    .refresh-timer {
      font-size: 12px;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding-bottom: 0;
    }

    .tab {
      padding: 8px 18px;
      border-radius: 8px 8px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.15s;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .compose-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 28px;
    }

    .compose-card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 14px;
    }

    .compose-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    select, textarea, input {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus, textarea:focus, input:focus {
      border-color: var(--text);
    }

    select {
      padding: 9px 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      padding: 10px 14px;
      resize: none;
      min-height: 80px;
    }

    .compose-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .anon-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .anon-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--text);
      cursor: pointer;
    }

    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { background: var(--border); }

    .posts-list { display: flex; flex-direction: column; gap: 16px; }

    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: box-shadow 0.15s;
    }

    .post-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .scenario-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--border);
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .scenario-badge.s1 { background: #E8E0D5; color: #5A5248; }
    .scenario-badge.s4 { background: #D5DDE8; color: #485A6A; }

    .post-time {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    .post-content {
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reactions-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .reaction-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'DM Sans', sans-serif;
    }

    .reaction-btn:hover {
      background: var(--border);
      transform: scale(1.05);
    }

    .reaction-btn .count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .comments-section { border-top: 1px solid var(--border); padding-top: 14px; }

    .comments-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 10px;
    }

    .comments-toggle:hover { color: var(--text); }

    .comment-item {
      padding: 8px 12px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .comment-item-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .comment-form input {
      flex: 1;
      padding: 8px 12px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state p { font-size: 14px; margin-top: 8px; }

    .loading-spinner {
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
      .header-top { flex-direction: column; gap: 10px; }
      .compose-row { flex-direction: column; align-items: stretch; }
      .stats-bar { gap: 14px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="logo">TruthLens <span>2034 프로젝트 의견 게시판</span></div>
      </div>
      <div style="text-align:right">
        <div class="stats-bar" id="statsBar">
          <span>게시글 <strong id="statPosts">—</strong></span>
          <span>댓글 <strong id="statComments">—</strong></span>
          <span>반응 <strong id="statReactions">—</strong></span>
        </div>
        <div class="refresh-timer" id="refreshTimer" style="margin-top:4px">15초 후 갱신</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-scenario="all">전체</button>
      <button class="tab" data-scenario="S1">S1 — 도입기</button>
      <button class="tab" data-scenario="S4">S4 — 저항기</button>
    </div>
  </div>
</header>

<main>
  <div class="compose-card">
    <h2>의견 남기기</h2>
    <div class="compose-row">
      <select id="scenarioSelect">
        <option value="S1">S1 — 도입기</option>
        <option value="S4">S4 — 저항기</option>
      </select>
    </div>
    <textarea id="postContent" placeholder="2034년 TruthLens 세계관에 대한 생각을 자유롭게 적어주세요..." rows="3"></textarea>
    <div class="compose-footer">
      <label class="anon-toggle">
        <input type="checkbox" id="anonCheck" checked>
        익명으로 게시
      </label>
      <button class="btn" id="submitBtn" onclick="submitPost()">게시하기</button>
    </div>
  </div>

  <div id="postsList" class="posts-list">
    <div class="loading-spinner"><div class="spinner"></div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://icyvlepypojvfkxxdprd.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljeXZsZXB5cG9qdmZreHhkcHJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwODYxMzgsImV4cCI6MjA5NDY2MjEzOH0.vnmIgsnb3eO1Yf0r7-YHHGhyV6Fec-uD43Guit4ReBM'
  );

  const EMOJIS = ['😮','🤔','👍','😢','🔥'];
  let currentTab = 'all';
  let allPosts = [];
  let allComments = [];
  let allReactions = [];
  let refreshInterval = null;
  let countdown = 15;
  let openComments = new Set();

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.scenario;
      renderPosts();
    });
  });

  function showToast(msg, duration = 2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function timeAgo(dateStr) {
    const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
    if (diff < 60) return '방금 전';
    if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
    return `${Math.floor(diff/86400)}일 전`;
  }

  async function fetchAll() {
    const [postsRes, commentsRes, reactionsRes] = await Promise.all([
      sb.from('posts').select('*').order('created_at', { ascending: false }),
      sb.from('comments').select('*').order('created_at', { ascending: true }),
      sb.from('reactions').select('*')
    ]);
    allPosts = postsRes.data || [];
    allComments = commentsRes.data || [];
    allReactions = reactionsRes.data || [];
    updateStats();
    renderPosts();
  }

  function updateStats() {
    document.getElementById('statPosts').textContent = allPosts.length;
    document.getElementById('statComments').textContent = allComments.length;
    document.getElementById('statReactions').textContent = allReactions.length;
  }

  function renderPosts() {
    const list = document.getElementById('postsList');
    const filtered = currentTab === 'all'
      ? allPosts
      : allPosts.filter(p => p.scenario === currentTab);

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">
        <div style="font-size:32px">📭</div>
        <p>아직 게시글이 없습니다. 첫 번째 의견을 남겨보세요.</p>
      </div>`;
      return;
    }

    list.innerHTML = filtered.map(post => {
      const postComments = allComments.filter(c => c.post_id === post.id);
      const postReactions = allReactions.filter(r => r.post_id === post.id);
      const reactionMap = {};
      postReactions.forEach(r => { reactionMap[r.emoji] = (reactionMap[r.emoji] || 0) + 1; });
      const showComments = openComments.has(post.id);

      return `<div class="post-card" id="post-${post.id}">
        <div class="post-meta">
          <span class="scenario-badge ${post.scenario.toLowerCase()}">${post.scenario}</span>
          <span style="font-size:13px;color:var(--muted)">익명</span>
          <span class="post-time">${timeAgo(post.created_at)}</span>
        </div>
        <div class="post-content">${escapeHtml(post.content)}</div>
        <div class="reactions-row">
          ${EMOJIS.map(e => `
            <button class="reaction-btn" onclick="addReaction('${post.id}', '${e}')">
              ${e} <span class="count">${reactionMap[e] || 0}</span>
            </button>
          `).join('')}
        </div>
        <div class="comments-section">
          <button class="comments-toggle" onclick="toggleComments('${post.id}')">
            ${showComments ? '▲ 댓글 접기' : `▼ 댓글 ${postComments.length}개`}
          </button>
          ${showComments ? `
            <div class="comments-list">
              ${postComments.length === 0 ? '<p style="font-size:13px;color:var(--muted);margin-bottom:8px">아직 댓글이 없습니다.</p>' : ''}
              ${postComments.map(c => `
                <div class="comment-item">
                  <div class="comment-item-meta">익명 · ${timeAgo(c.created_at)}</div>
                  ${escapeHtml(c.content)}
                </div>
              `).join('')}
            </div>
            <div class="comment-form">
              <input type="text" id="comment-input-${post.id}" placeholder="댓글 달기..." onkeydown="if(event.key==='Enter') submitComment('${post.id}')">
              <button class="btn btn-ghost" style="padding:8px 14px;font-size:13px" onclick="submitComment('${post.id}')">달기</button>
            </div>
          ` : ''}
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleComments(postId) {
    if (openComments.has(postId)) {
      openComments.delete(postId);
    } else {
      openComments.add(postId);
    }
    renderPosts();
  }

  async function submitPost() {
    const content = document.getElementById('postContent').value.trim();
    const scenario = document.getElementById('scenarioSelect').value;
    if (!content) { showToast('내용을 입력해주세요.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '게시 중...';

    const { error } = await sb.from('posts').insert({ scenario, content });
    if (error) {
      showToast('오류가 발생했습니다: ' + error.message);
    } else {
      document.getElementById('postContent').value = '';
      showToast('게시되었습니다.');
      await fetchAll();
    }
    btn.disabled = false;
    btn.textContent = '게시하기';
  }

  async function submitComment(postId) {
    const input = document.getElementById(`comment-input-${postId}`);
    const content = input ? input.value.trim() : '';
    if (!content) return;

    const { error } = await sb.from('comments').insert({ post_id: postId, content });
    if (!error) {
      showToast('댓글이 달렸습니다.');
      await fetchAll();
    }
  }

  async function addReaction(postId, emoji) {
    await sb.from('reactions').insert({ post_id: postId, emoji });
    const idx = allReactions.findIndex(r => false);
    allReactions.push({ post_id: postId, emoji, id: Date.now(), created_at: new Date().toISOString() });
    updateStats();
    renderPosts();
    await fetchAll();
  }

  // Auto-refresh countdown
  function startCountdown() {
    countdown = 15;
    clearInterval(refreshInterval);
    refreshInterval = setInterval(async () => {
      countdown--;
      document.getElementById('refreshTimer').textContent = `${countdown}초 후 갱신`;
      if (countdown <= 0) {
        countdown = 15;
        await fetchAll();
      }
    }, 1000);
  }

  fetchAll().then(startCountdown);
</script>
</body>
</html>
